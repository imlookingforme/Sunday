<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#00ff88" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="../manifest.json" />
  <title>Sunday Mobile</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:      #0a0a0f;
      --surface: #12121a;
      --border:  #1e1e2e;
      --text:    #e0e0e0;
      --muted:   #888;
      --accent:  #00ff88;
      --danger:  #ff4466;
      --pending: #ffaa00;
      --running: #00aaff;
      --done:    #00ff88;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
    }

    header .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    /* ── Task Board ── */
    #task-board {
      padding: 20px;
    }

    #task-board h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .task-item .task-title {
      font-size: 0.95rem;
      flex: 1;
    }

    .task-item .status-pill {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 10px;
      border-radius: 20px;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .status-pill.pending  { background: rgba(255,170,0,0.15);  color: var(--pending); }
    .status-pill.running  { background: rgba(0,170,255,0.15);  color: var(--running); }
    .status-pill.done     { background: rgba(0,255,136,0.15);  color: var(--done);    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
      font-size: 0.9rem;
    }

    /* ── Voice Button ── */
    #voice-section {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(transparent, var(--bg) 30%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #voice-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      background: var(--surface);
      color: var(--accent);
      font-size: 1.8rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #voice-btn:active,
    #voice-btn.recording {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 24px rgba(0,255,136,0.4);
    }

    #voice-btn.recording {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 24px rgba(0,255,136,0.4); }
      50%      { box-shadow: 0 0 48px rgba(0,255,136,0.6); }
    }

    #voice-status {
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    /* ── Response Toast ── */
    #response-toast {
      position: fixed;
      bottom: 140px;
      left: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 20;
    }

    #response-toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>☀ SUNDAY</h1>
    <div class="status-dot" id="status-dot"></div>
  </header>

  <!-- Task Board -->
  <section id="task-board">
    <h2>Tasks</h2>
    <ul class="task-list" id="task-list">
      <li class="empty-state">Loading tasks…</li>
    </ul>
  </section>

  <!-- Voice Section -->
  <section id="voice-section">
    <button id="voice-btn" aria-label="Record voice">🎙</button>
    <span id="voice-status">Tap to record</span>
  </section>

  <!-- Response Toast -->
  <div id="response-toast" role="alert"></div>

  <script>
    // ─── Service Worker Registration ───
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/mobile/sw.js').catch(() => {
        console.log('[SW] Service worker registration deferred — no sw.js yet');
      });
    }

    // ─── Constants ───
    const API_BASE    = '/api';
    const POLL_MS     = 5000;
    const TOAST_MS    = 4000;

    // ─── DOM refs ───
    const taskListEl  = document.getElementById('task-list');
    const voiceBtn    = document.getElementById('voice-btn');
    const voiceStatus = document.getElementById('voice-status');
    const toastEl     = document.getElementById('response-toast');

    // ─── Task Board ───
    async function loadTasks() {
      try {
        const res = await fetch(`${API_BASE}/mobile/tasks`);
        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        renderTasks(data.tasks || []);
      } catch (err) {
        console.warn('[Tasks]', err);
      }
    }

    function renderTasks(tasks) {
      if (!tasks.length) {
        taskListEl.innerHTML = '<li class="empty-state">No tasks yet — say something!</li>';
        return;
      }
      taskListEl.innerHTML = tasks.map(t => {
        const status = (t.status || 'pending').toLowerCase();
        const pillClass = ['pending', 'running', 'done'].includes(status) ? status : 'pending';
        const title = t.title || t.description || 'Untitled task';
        return `<li class="task-item">
          <span class="task-title">${escapeHtml(title)}</span>
          <span class="status-pill ${pillClass}">${status}</span>
        </li>`;
      }).join('');
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // Poll for tasks
    loadTasks();
    setInterval(loadTasks, POLL_MS);

    // ─── Voice Recording ───
    let mediaRecorder = null;
    let audioChunks   = [];
    let recording     = false;

    voiceBtn.addEventListener('click', async () => {
      if (recording) {
        stopRecording();
      } else {
        await startRecording();
      }
    });

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: getSupportedMime() });
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
          await sendVoice(blob);
        };

        mediaRecorder.start();
        recording = true;
        voiceBtn.classList.add('recording');
        voiceStatus.textContent = 'Recording… tap to stop';
      } catch (err) {
        console.error('[Voice]', err);
        voiceStatus.textContent = 'Mic access denied';
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      recording = false;
      voiceBtn.classList.remove('recording');
      voiceStatus.textContent = 'Sending…';
    }

    function getSupportedMime() {
      const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
      for (const t of types) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    async function sendVoice(blob) {
      try {
        const form = new FormData();
        form.append('audio', blob, 'recording.webm');

        const res = await fetch(`${API_BASE}/mobile/voice`, {
          method: 'POST',
          body: form
        });

        if (!res.ok) throw new Error(res.statusText);
        const data = await res.json();
        showToast(data.response || 'Voice received ✔');
        voiceStatus.textContent = 'Tap to record';

        // Refresh tasks after voice command
        loadTasks();
      } catch (err) {
        console.error('[Voice Send]', err);
        voiceStatus.textContent = 'Send failed — try again';
      }
    }

    // ─── Toast ───
    let toastTimer = null;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), TOAST_MS);
    }
  </script>
</body>
</html>
