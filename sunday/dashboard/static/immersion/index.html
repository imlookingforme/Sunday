<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunday - Cyberpunk Fullscreen Immersion</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      background: #06080d;
      color: #00ff88;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      border-bottom: 1px solid rgba(0, 255, 136, 0.2);
      background: rgba(10, 15, 25, 0.8);
      backdrop-filter: blur(12px);
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 255, 136, 0.6);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .persona-selector {
      display: flex;
      gap: 12px;
    }
    .btn-persona {
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .btn-persona.active, .btn-persona:hover {
      background: #00ff88;
      color: #06080d;
      box-shadow: 0 0 16px rgba(0, 255, 136, 0.5);
    }
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: calc(100vh - 65px);
      width: 100%;
    }
    .orb-canvas-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(16, 28, 48, 0.6) 0%, rgba(6, 8, 13, 0.95) 75%);
    }
    .orb-visual-mount {
      width: 100%;
      height: 100%;
    }
    .immersion-telemetry {
      position: absolute;
      bottom: 24px;
      left: 32px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.6;
    }
    .side-dock {
      border-left: 1px solid rgba(0, 255, 136, 0.2);
      background: rgba(10, 15, 25, 0.6);
      backdrop-filter: blur(12px);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel-box {
      border: 1px solid rgba(0, 255, 136, 0.25);
      border-radius: 8px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.4);
    }
    .panel-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .deadline-item {
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .audio-meter {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 8px;
    }
    .audio-meter-fill {
      height: 100%;
      width: 45%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      transition: width 0.1s ease;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="header-bar">
    <div class="brand">
      <span>⚡</span> SUNDAY IMMERSION SYSTEM // ACTIVE
    </div>
    <div class="persona-selector">
      <button class="btn-persona active" onclick="switchPersona('senpai')">🌸 SENPAI</button>
      <button class="btn-persona" onclick="switchPersona('genz')">👾 GENZ</button>
      <button class="btn-persona" onclick="switchPersona('jarvis')">💠 JARVIS</button>
      <button class="btn-persona" onclick="switchPersona('friday')">🔥 FRIDAY</button>
      <button class="btn-persona" onclick="switchPersona('reflective')">🌌 REFLECTIVE</button>
    </div>
  </div>

  <div class="workspace-grid">
    <div class="orb-canvas-container" id="canvasContainer">
      <div id="threeMount" class="orb-visual-mount"></div>
      <div class="immersion-telemetry">
        [SYS] SWARM RUNTIME: ACTIVE<br>
        [NET] 5 MESH SPECIALISTS ONLINE<br>
        [FFT] AUDIO FLUID DISPLACEMENT: ENABLED
      </div>
    </div>

    <div class="side-dock">
      <div class="panel-box">
        <div class="panel-title">🌱 Forest Garden Progress</div>
        <div style="font-size: 24px; font-weight: bold; margin: 8px 0;" id="immersionTimer">25:00</div>
        <div style="font-size: 12px; color: rgba(255,255,255,0.7);" id="immersionSpecies">Sakura Cherry Blossom</div>
        <div class="audio-meter"><div class="audio-meter-fill" id="immersionMeter"></div></div>
      </div>

      <div class="panel-box">
        <div class="panel-title">⏳ Academic Deadlines</div>
        <div id="deadlineList">
          <div class="deadline-item">
            <span>OS File System Design</span>
            <span style="color: #ff4444;">tomorrow</span>
          </div>
          <div class="deadline-item">
            <span>Distributed Cache Review</span>
            <span>2 days</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, sphere, material;
    let currentPersona = 'senpai';

    const PERSONA_COLORS = {
      senpai: 0xffb7c5,
      genz: 0x00ff88,
      jarvis: 0x00d2ff,
      friday: 0xff512f,
      reflective: 0xa18cd1
    };

    function initThree() {
      const mount = document.getElementById('threeMount');
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, mount.clientWidth / mount.clientHeight, 0.1, 1000);
      camera.position.z = 2.8;

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(mount.clientWidth, mount.clientHeight);
      mount.appendChild(renderer.domElement);

      const geometry = new THREE.SphereGeometry(1.1, 64, 64);
      material = new THREE.MeshStandardMaterial({
        color: PERSONA_COLORS.senpai,
        wireframe: false,
        roughness: 0.15,
        metalness: 0.85
      });
      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      const light = new THREE.PointLight(0xffffff, 2, 100);
      light.position.set(5, 5, 5);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040, 2));

      window.addEventListener('resize', onResize);
      animate();
    }

    function onResize() {
      const mount = document.getElementById('threeMount');
      camera.aspect = mount.clientWidth / mount.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(mount.clientWidth, mount.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (sphere) {
        sphere.rotation.y += 0.01;
        sphere.rotation.x += 0.005;
      }
      renderer.render(scene, camera);
    }

    function switchPersona(p) {
      currentPersona = p;
      if (material && PERSONA_COLORS[p]) {
        material.color.setHex(PERSONA_COLORS[p]);
      }
      document.querySelectorAll('.btn-persona').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }

    window.onload = initThree;
  </script>
</body>
</html>
