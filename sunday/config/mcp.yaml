# MCP (Model Context Protocol) Server Configuration
# Configure which MCP servers Sunday should connect to

# Enable/disable MCP integration
enabled: true

# Auto-connect to servers on startup
auto_connect: true

# Server configurations
servers:
  filesystem:
    enabled: true
    name: "filesystem"
    description: "Extended file operations"
    url: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-filesystem"
      - "sunday/data"
    env: {}
    auto_connect: true

  github:
    enabled: false  # Disabled by default, requires GitHub token
    name: "github"
    description: "GitHub issues, PRs, repos"
    url: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-github"
    env:
      GITHUB_TOKEN: "{{secret:github_token}}"
    auto_connect: false

  notion:
    enabled: false  # Disabled by default, requires Notion API key
    name: "notion"
    description: "Notion API integration"
    url: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-notion"
    env:
      NOTION_API_KEY: "{{secret:notion_api_key}}"
    auto_connect: false

  google-workspace:
    enabled: false  # Disabled by default, requires Google credentials
    name: "google-workspace"
    description: "Gmail, Calendar, Docs"
    url: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-gmail"
    env:
      GMAIL_ACCESS_TOKEN: "{{secret:gmail_access_token}}"
      GMAIL_REFRESH_TOKEN: "{{secret:gmail_refresh_token}}"
    auto_connect: false

  microsoft-graph:
    enabled: false  # Disabled by default, requires Microsoft credentials
    name: "microsoft-graph"
    description: "Outlook, Teams, OneDrive"
    url: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-microsoft-graph"
    env:
      MICROSOFT_CLIENT_ID: "{{secret:microsoft_client_id}}"
      MICROSOFT_CLIENT_SECRET: "{{secret:microsoft_client_secret}}"
    auto_connect: false

  brave-search:
    enabled: false  # Disabled by default, requires Brave API key
    name: "brave-search"
    description: "Brave web search"
    url: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-brave-search"
    env:
      BRAVE_API_KEY: "{{secret:brave_api_key}}"
    auto_connect: false

  postgres:
    enabled: false  # Disabled by default, requires PostgreSQL connection string
    name: "postgres"
    description: "PostgreSQL database"
    url: "stdio"
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-postgres"
    env:
      POSTGRES_CONNECTION_STRING: "{{secret:postgres_connection_string}}"
    auto_connect: false

# Custom servers (add your own MCP servers here)
custom_servers:
  # example:
  #   my-custom-server:
  #     enabled: true
  #     name: "my-custom-server"
  #     description: "My custom MCP server"
  #     url: "stdio"
  #     command: "python"
  #     args:
  #       - "-m"
  #       - "my_mcp_server"
  #     env: {}
  #     auto_connect: true

# Secret configuration
# Secrets are stored in OS keystore and injected at runtime
# Use {{secret:NAME}} syntax in server configs
secrets:
  github_token:
    description: "GitHub personal access token"
    required: false

  notion_api_key:
    description: "Notion integration API key"
    required: false

  gmail_access_token:
    description: "Gmail OAuth access token"
    required: false

  gmail_refresh_token:
    description: "Gmail OAuth refresh token"
    required: false

  microsoft_client_id:
    description: "Microsoft Graph client ID"
    required: false

  microsoft_client_secret:
    description: "Microsoft Graph client secret"
    required: false

  brave_api_key:
    description: "Brave Search API key"
    required: false

  postgres_connection_string:
    description: "PostgreSQL connection string"
    required: false

# Tool routing configuration
# Map MCP tools to Sunday operators
tool_routing:
  filesystem:
    operator: "automation"

  github:
    operator: "coding"

  notion:
    operator: "automation"

  google-workspace:
    operator: "automation"

  microsoft-graph:
    operator: "automation"

  brave-search:
    operator: "research"

  postgres:
    operator: "automation"
