[project]
name = "sunday"
version = "0.1.0"
description = "Sunday - Voice-first, local-first personal AI agent"
authors = [
    {name = "Sunday Development Team"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "aiofiles",
    # Core
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    
    # LLM & AI
    "ollama>=0.1.0",
    "openai>=1.0.0",
    
    # Memory & Data
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    
    # Productivity
    "icalendar>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    
    # System
    "psutil>=5.9.0",
    
    "watchdog>=3.0.0",
    
    # Swarm & Networking
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

voice = [
    "openwakeword>=0.6.0",
    "faster-whisper>=0.10.0",
    "piper-tts>=1.0.0",
    "edge-tts>=6.0.0",
    "pyaudio>=0.2.13",
]

vision = [
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "pytesseract>=0.3.10",
]

office = [
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.21",
]

dashboard = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sse-starlette>=1.6.0",
]

mobile = [
    "qrcode[pil]>=7.4.2",
    "aiohttp>=3.9.0",
]

all = [
    "sunday[dev,voice,vision,office,dashboard,mobile]",
]

[project.scripts]
sunday = "sunday.daemon.pipeline:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sunday*"]
exclude = ["sync_agent*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
